name: To get your heartbreak

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    outputs:
      web_version: ${{ steps.wv.outputs.web_version }}
    steps:
      - name: Clone OpenList Front-End
        shell: bash
        run: |
          rm -rf */
          git clone --depth 1 https://github.com/OpenListTeam/OpenList-Frontend.git ./

      - name: Get version
        id: wv
        shell: bash
        run: |
          web_version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version":[[:space:]]*"([^"]+)".*/\1/')
          echo "web_version=$web_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@master

      - name: Build OpenList Frontend
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh --dev
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: Frontend
          path: dist/

  OpenList:
    name: Build for ${{ matrix.dickname }}
    needs: Frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "GOAMD64=v4"
            dickname: "linux-amd64v4-glibc"
          - tag: "GOAMD64=v3"
            dickname: "linux-amd64v3-glibc"
          - tag: "GOAMD64=v2"
            dickname: "linux-amd64v2-glibc"
          - tag: "GOAMD64=v1"
            dickname: "linux-amd64v1-glibc"
          - tag: "CGO_ENABLED=1"
            dickname: "linux-amd64-glibc"
          - tag: "CGO_ENABLED=0"
            dickname: "linux-amd64-musl"
          - tag: "CGO_ENABLED=0 GOARCH=arm64"
            dickname: "linux-arm64-musl"
          - tag: "GOOS=darwin GOARCH=arm64"
            dickname: "darwin-arm64"
          - tag: "GOOS=windows GOARCH=amd64"
            dickname: "windows-amd64.exe"

    steps:
      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: "stable"

      - name: Clone source code
        shell: bash
        run: |
          git clone --depth 1 https://github.com/OpenListTeam/OpenList.git backend-src
          mkdir -p backend-src/public/dist

      - name: Download frontend
        uses: actions/download-artifact@main
        with:
          name: Frontend
          path: backend-src/public/dist

      - name: Build OpenList Backend
        shell: bash
        run: |
          cd backend-src
          builtAt="$(date +'%F %T %z')"
          goVersion=$(go version | sed 's/go version //')
          gitAuthor=$(git show -s --format='format:%aN <%ae>' HEAD)
          gitCommit=$(git log --pretty=format:"%h" -1)
          version=$(git describe --long --tags --dirty --always)
          webVersion="${{ needs.Frontend.outputs.web_version }}"
          if [ -z "$webVersion" ]; then
              exit 1
          fi
          ldflags="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$builtAt' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GoVersion=$goVersion' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=$gitAuthor' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$gitCommit' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$version' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=$webVersion'"

          ${{ matrix.tag }} go build -ldflags "$ldflags" -o ../openlist-${{ matrix.dickname }} .

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: openlist
          files: openlist-${{ matrix.dickname }}
          body: |
            # ⚙ OpenList
            High performance build
            ## 📏 Filename Rule
            **openlist-os-arch(optimize)-libc(only linux)**

            For example: `openlist-amd64v4-glibc`
            ## Made by
            MoAEIOU & GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: openlist-${{ matrix.dickname }}
          remote: openlist/
          key: ${{ secrets.SSH_KEY }}

  OpenWrt:
    name: Build for openwrt-${{ matrix.patch_arch }}
    needs: OpenList
    runs-on: ubuntu-latest
    env:
      project_name: "luci-app-oplist"
    strategy:
      fail-fast: false
      matrix:
        include:
          - patch_arch: "x86_64"
            sdk_arch: "x86-64"
            dickname: "linux-amd64-musl"
          - patch_arch: "aarch64_generic"
            sdk_arch: "rockchip-armv8"
            dickname: "linux-arm64-musl"
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          path: ${{ env.project_name }}

      - name: Get version
        id: get_version
        shell: bash
        run: |
          cd ${{ env.project_name }}
          VERSION=$(grep -E "^PKG_VERSION[[:space:]]*:=" Makefile | sed -E 's/.*:=[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare SDK
        id: sdk
        uses: moaeiou/moaeiou/actions/prepare-sdk@main
        with:
          sdk_arch: ${{ matrix.sdk_arch }}

      - name: Preparation before compilation
        shell: bash
        run: |
          mv ${{ env.project_name }} ${{ steps.sdk.outputs.sdk_dir }}/package/
          cd ${{ steps.sdk.outputs.sdk_dir }}/package/${{ env.project_name }}/
          if [ "${{ matrix.patch_arch }}" != "x86_64" ]; then
            sed -i 's/x86_64/${{ matrix.patch_arch }}/g' ./Makefile
          fi
          cd root/usr/bin/
          rm -f DONOTREMOVE
          wget -O openlist https://github.com/morouter/luci-app-oplist/releases/download/openlist/openlist-${{ matrix.dickname }}
          chmod +x ./openlist
          cd ../../etc/openlist
          rm DONOTREMOVE

      - name: Build!
        shell: bash
        run: |
          cd ${{ steps.sdk.outputs.sdk_dir }}
          make package/${{ env.project_name }}/compile V=s -j$(nproc)

      - name: Rename compilation files
        shell: bash
        run: |
          mv ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/*/base/luci-app-oplist-*.apk ./luci-app-oplist-${{ matrix.patch_arch }}.apk
          mv ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/*/base/luci-i18n-oplist-zh-cn-*.apk ./luci-i18n-oplist-zh-cn.apk
          mv ${{ steps.sdk.outputs.sdk_dir }}/bin/packages/*/base/luci-i18n-oplist-zh-tw-*.apk ./luci-i18n-oplist-zh-tw.apk
          ln -s ./luci-app-oplist-${{ matrix.patch_arch }}.apk ./luci-app-oplist-${{ steps.get_version.outputs.version }}-${{ matrix.patch_arch }}.apk

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: |
            luci-i18n-oplist-*.apk
            luci-app-oplist-${{ steps.get_version.outputs.version }}-${{ matrix.patch_arch }}.apk
          body: |
            # 📝 Release Notes
            - Fixes and improvements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to mirror
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: luci-app-oplist-${{ matrix.patch_arch }}.apk luci-i18n-oplist-*.apk
          remote: luci-app/oplist/
          key: ${{ secrets.SSH_KEY }}
